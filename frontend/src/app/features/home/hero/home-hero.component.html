<section
  class="app-hero bg-primary px-4 py-16 md:py-32"
  data-purpose="hero-search"
  [style]="heroOverlayStyle"
>
  <div class="container mx-auto text-center">
    <h1 class="font-headline text-4xl md:text-6xl font-bold text-white mb-6">
      Encuentra los Mejores Lugares
    </h1>
    <p class="text-lg md:text-xl text-white/90 mb-12 max-w-2xl mx-auto">
      Desde dunas doradas hasta la brisa del océano: descubre restaurantes,
      hoteles y experiencias locales únicas.
    </p>

    <div
      class="max-w-5xl mx-auto bg-white/20 backdrop-blur-md p-4 rounded-lg"
    >
      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        class="grid grid-cols-1 md:grid-cols-4 gap-3"
        novalidate
      >
        <div class="relative">
          <label
            for="hero-search-q"
            class="sr-only"
          >
            Buscar
          </label>
          <input
            id="hero-search-q"
            type="text"
            formControlName="q"
            class="w-full px-4 py-4 rounded-lg border-none focus:ring-2 focus:ring-primary text-on-surface"
            placeholder="¿Qué estás buscando?"
            aria-label="Buscar"
          />
        </div>

        <div>
          <label
            for="hero-search-categoria"
            class="sr-only"
          >
            Categoría
          </label>
          <select
            id="hero-search-categoria"
            formControlName="categoriaId"
            class="w-full px-4 py-4 rounded-lg border-none focus:ring-2 focus:ring-primary text-on-surface-variant"
            aria-label="Categoría"
          >
            <option value="">Seleccionar categoría</option>
            <option *ngFor="let c of categorias" [value]="c.id">
              {{ c.nombre }}
            </option>
          </select>
        </div>

        <div>
          <label
            for="hero-search-ubicacion"
            class="sr-only"
          >
            Ubicación
          </label>
          <select
            id="hero-search-ubicacion"
            formControlName="barrioId"
            class="w-full px-4 py-4 rounded-lg border-none focus:ring-2 focus:ring-primary text-on-surface-variant"
            aria-label="Ubicación"
          >
            <option value="">Seleccionar ubicación</option>
            <option *ngFor="let b of barrios" [value]="b.id">
              {{ b.nombre }}
            </option>
          </select>
        </div>

        <button
          type="submit"
          class="bg-secondary-container text-primary font-bold py-4 rounded-lg hover:bg-opacity-90 transition-all"
        >
          Buscar Ahora
        </button>
      </form>
    </div>
  </div>
</section>
