name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Framework self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install framework deps
        run: npm install
      - name: check-refs
        run: bash check-refs.sh
      - name: specboot ci (dogfooding)
        run: bash specboot.sh --ci
      - name: Run framework self-tests (dogfooding)
        if: ${{ hashFiles('tests/*-test.sh') != '' }}
        run: |
          for t in tests/*-test.sh; do
            echo "→ running $t"
            bash "$t"
          done

  project-ci:
    name: Project CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install framework deps
        run: npm install
      - name: make ci (refs + solid-lint + lint + test + audit)
        run: make ci
