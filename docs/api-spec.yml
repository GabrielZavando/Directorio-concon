        organizadorWeb:
          type: string
          format: uri
          nullable: true
        ubicacionNombre:
          type: string
          maxLength: 200
          nullable: true
        ubicacionDireccion:
          type: string
          maxLength: 200
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        precioTipo:
          type: string
          enum: [gratis, pago, donacion, invitacion]
        precioValor:
