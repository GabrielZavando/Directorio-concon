openapi: 3.0.3
info:
  title: Directorio Concón API
  description: |
    API REST para el Directorio de Lugares de Concón (NestJS + Firebase Firestore).
    Contrato entre frontend y backend — actualizar ANTES de implementar cambios.
  version: "1.0.0"
  contact:
    name: Agencia Digital
    url: https://agencia-digital.cl
    email: desarrollo@agencia-digital.cl

servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
  - url: https://api.directorio-concon.com/v1
    description: Producción (VPS Docker)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de Firebase Auth (idToken)

  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Coordenadas:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number

    Turno:
      type: object
      required: [apertura, cierre]
      properties:
        apertura:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          example: "09:00"
        cierre:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          example: "14:00"

    HorarioDia:
      type: object
      required: [dia, abierto, turnos]
      properties:
        dia:
          type: string
          enum: [lunes, martes, miercoles, jueves, viernes, sabado, domingo]
        abierto:
          type: boolean
        turnos:
          type: array
          items:
            $ref: '#/components/schemas/Turno'

    HorarioEspecial:
      type: object
      required: [fecha, descripcion, turnos]
      properties:
        fecha:
          type: string
          format: date
          example: "2025-12-31"
        descripcion:
          type: string
          example: "Noche de Año Nuevo"
        turnos:
          type: array
          items:
            $ref: '#/components/schemas/Turno'

    RedSocial:
      type: object
      required: [plataforma, url]
      properties:
        plataforma:
          type: string
          enum: [instagram, facebook, x-twitter, linkedin, tiktok, youtube]
          description: |
            Closed enum. The legacy 'twitter' value was migrated to 'x-twitter'
            (reflecting the 2023 platform rename). Clients sending 'twitter'
            receive a 400; they must update to 'x-twitter'. Consistent with
            docs/data-model.md PlataformaSocialEnum and the backend VO/DTO.
        url:
          type: string
          format: uri

    Imagenes:
      type: object
      properties:
        logo:
          type: string
          format: uri
          nullable: true
        portada:
          type: string
          format: uri
          nullable: true
        galeria:
          type: array
          items:
            type: string
            format: uri

    ValoracionGoogle:
      type: object
      properties:
        rating:
          type: number
          minimum: 0
          maximum: 5
        reviewsCount:
          type: integer
          minimum: 0
        mapsLink:
          type: string
          format: uri

    Place:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        nombre:
          type: string
        descripcionCorta:
          type: string
          maxLength: 140
        descripcion:
          type: string
        categoriaId:
          type: string
        subcategoriaId:
          type: string
          nullable: true
        barrioId:
          type: string
        direccion:
          type: string
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        telefono:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        sitioWeb:
          type: string
          format: uri
          nullable: true
        redesSociales:
          type: array
          items:
            $ref: '#/components/schemas/RedSocial'
          maxItems: 3
        imagenes:
          $ref: '#/components/schemas/Imagenes'
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/HorarioDia'
        horariosEspeciales:
          type: array
          items:
            $ref: '#/components/schemas/HorarioEspecial'
        abierto24x7:
          type: boolean
        servicios:
          type: array
          items:
            type: string
            enum: [wifi, estacionamiento, acceso-discapacidad, apto-mascotas, delivery, take-away, terraza, vista-al-mar, reservas, ninos-bienvenida]
        metodosPago:
          type: array
          items:
            type: string
            enum: [efectivo, debito, credito, transferencia, qr]
        idiomas:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pendiente, aprobado, rechazado]
        verificado:
          type: boolean
        fechaVerificacion:
          type: string
          format: date-time
          nullable: true
        destacado:
          type: boolean
        planId:
          type: string
          enum: [gratuito, premium]
        vistasTotales:
          type: integer
          minimum: 0
        valoracionGoogle:
          $ref: '#/components/schemas/ValoracionGoogle'
        usuarioId:
          type: string
        fechaPublicacion:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePlace:
      type: object
      required: [nombre, descripcionCorta, descripcion, categoriaId, barrioId, direccion, planId]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        descripcionCorta:
          type: string
          minLength: 1
          maxLength: 140
        descripcion:
          type: string
          minLength: 10
          maxLength: 2000
        categoriaId:
          type: string
        subcategoriaId:
          type: string
          nullable: true
        barrioId:
          type: string
        direccion:
          type: string
          maxLength: 200
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        telefono:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        sitioWeb:
          type: string
          format: uri
          nullable: true
        redesSociales:
          type: array
          items:
            $ref: '#/components/schemas/RedSocial'
          maxItems: 3
        imagenes:
          $ref: '#/components/schemas/Imagenes'
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/HorarioDia'
        horariosEspeciales:
          type: array
          items:
            $ref: '#/components/schemas/HorarioEspecial'
        abierto24x7:
          type: boolean
          default: false
        servicios:
          type: array
          items:
            type: string
            enum: [wifi, estacionamiento, acceso-discapacidad, apto-mascotas, delivery, take-away, terraza, vista-al-mar, reservas, ninos-bienvenida]
        metodosPago:
          type: array
          items:
            type: string
            enum: [efectivo, debito, credito, transferencia, qr]
        idiomas:
          type: array
          items:
            type: string
        planId:
          type: string
          enum: [gratuito, premium]

    UpdatePlace:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        descripcionCorta:
          type: string
          maxLength: 140
        descripcion:
          type: string
          maxLength: 2000
        direccion:
          type: string
          maxLength: 200
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        telefono:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        sitioWeb:
          type: string
          format: uri
          nullable: true
        redesSociales:
          type: array
          items:
            $ref: '#/components/schemas/RedSocial'
          maxItems: 3
        imagenes:
          $ref: '#/components/schemas/Imagenes'
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/HorarioDia'
        horariosEspeciales:
          type: array
          items:
            $ref: '#/components/schemas/HorarioEspecial'
        abierto24x7:
          type: boolean
        servicios:
          type: array
          items:
            type: string
            enum: [wifi, estacionamiento, acceso-discapacidad, apto-mascotas, delivery, take-away, terraza, vista-al-mar, reservas, ninos-bienvenida]
        metodosPago:
          type: array
          items:
            type: string
            enum: [efectivo, debito, credito, transferencia, qr]
        idiomas:
          type: array
          items:
            type: string
        destacado:
          type: boolean
        planId:
          type: string
          enum: [gratuito, premium]

    AbiertoAhoraResponse:
      type: object
      required: [abierto]
      properties:
        abierto:
          type: boolean
        turno:
          $ref: '#/components/schemas/Turno'

    MapDataItem:
      type: object
      required: [id, slug, nombre, coordenadas, categoriaId, barrioId]
      properties:
        id:
          type: string
        slug:
          type: string
        nombre:
          type: string
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        categoriaId:
          type: string
        barrioId:
          type: string

    Evento:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        nombre:
          type: string
        descripcionCorta:
          type: string
          maxLength: 140
        descripcion:
          type: string
        categoriaId:
          type: string
        subcategoriaId:
          type: string
        barrioId:
          type: string
        organizador:
          type: string
        organizadorContacto:
          type: string
          nullable: true
        organizadorWeb:
          type: string
          format: uri
          nullable: true
        ubicacionNombre:
          type: string
          nullable: true
        ubicacionDireccion:
          type: string
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        precioTipo:
          type: string
          enum: [gratis, pago, donacion, invitacion]
        precioValor:
          type: number
          minimum: 0
        precioMoneda:
          type: string
          enum: [CLP, USD]
        capacidadMaxima:
          type: integer
          minimum: 1
          nullable: true
        publicoObjetivo:
          type: array
          items:
            type: string
            enum: [familia, adultos, tercera_edad, mascotas, todos, ninos, adolescentes]
        nivelRuido:
          type: string
          enum: [bajo, medio, alto]
        portada:
          type: string
          format: uri
          nullable: true
        accesibilidad:
          type: array
          items:
            type: string
            enum: [acceso-silla-ruedas, banos-accesibles, estacionamiento-reservado, interprete-senas, material-braille, rampa-acceso]
        status:
          type: string
          enum: [pendiente, aprobado, rechazado]
        estado:
          type: string
          enum: [borrador, programado, en_curso, finalizado, cancelado, suspendido]
        destacado:
          type: boolean
        verificado:
          type: boolean
        placeId:
          type: string
          nullable: true
        usuarioId:
          type: string
        vistasTotales:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        fechaPublicacion:
          type: string
          format: date-time
          nullable: true

    CreateEvento:
      type: object
      required: [nombre, descripcionCorta, descripcion, subcategoriaId, barrioId, organizador, ubicacionDireccion, coordenadas, fechaInicio, fechaFin, precioTipo, precioValor, publicoObjetivo, nivelRuido]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 120
        descripcionCorta:
          type: string
          minLength: 1
          maxLength: 140
        descripcion:
          type: string
          minLength: 10
          maxLength: 2000
        subcategoriaId:
          type: string
        barrioId:
          type: string
        organizador:
          type: string
          minLength: 1
          maxLength: 200
        organizadorContacto:
          type: string
          nullable: true
        organizadorWeb:
          type: string
          format: uri
          nullable: true
        ubicacionNombre:
          type: string
          maxLength: 200
          nullable: true
        ubicacionDireccion:
          type: string
          maxLength: 200
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        precioTipo:
          type: string
          enum: [gratis, pago, donacion, invitacion]
        precioValor:
          type: number
          minimum: 0
        precioMoneda:
          type: string
          enum: [CLP, USD]
          default: CLP
        capacidadMaxima:
          type: integer
          minimum: 1
          nullable: true
        publicoObjetivo:
          type: array
          items:
            type: string
            enum: [familia, adultos, tercera_edad, mascotas, todos, ninos, adolescentes]
          minItems: 1
        nivelRuido:
          type: string
          enum: [bajo, medio, alto]
        portada:
          type: string
          format: uri
          nullable: true
        accesibilidad:
          type: array
          items:
            type: string
            enum: [acceso-silla-ruedas, banos-accesibles, estacionamiento-reservado, interprete-senas, material-braille, rampa-acceso]
        placeId:
          type: string
          nullable: true

    UpdateEvento:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 120
        descripcionCorta:
          type: string
          maxLength: 140
        descripcion:
          type: string
          maxLength: 2000
        organizador:
          type: string
          maxLength: 200
        organizadorContacto:
          type: string
          nullable: true
        organizadorWeb:
          type: string
          format: uri
          nullable: true
        ubicacionNombre:
          type: string
          maxLength: 200
          nullable: true
        ubicacionDireccion:
          type: string
          maxLength: 200
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        precioTipo:
          type: string
          enum: [gratis, pago, donacion, invitacion]
        precioValor:
          type: number
          minimum: 0
        precioMoneda:
          type: string
          enum: [CLP, USD]
        capacidadMaxima:
          type: integer
          minimum: 1
          nullable: true
        publicoObjetivo:
          type: array
          items:
            type: string
            enum: [familia, adultos, tercera_edad, mascotas, todos, ninos, adolescentes]
          minItems: 1
        nivelRuido:
          type: string
          enum: [bajo, medio, alto]
        portada:
          type: string
          format: uri
          nullable: true
        accesibilidad:
          type: array
          items:
            type: string
            enum: [acceso-silla-ruedas, banos-accesibles, estacionamiento-reservado, interprete-senas, material-braille, rampa-acceso]
        destacado:
          type: boolean
        verificado:
          type: boolean
        placeId:
          type: string
          nullable: true

    EventoMapDataItem:
      type: object
      required: [id, slug, nombre, coordenadas, subcategoriaId, barrioId, fechaInicio]
      properties:
        id:
          type: string
        slug:
          type: string
        nombre:
          type: string
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        subcategoriaId:
          type: string
        barrioId:
          type: string
        fechaInicio:
          type: string
          format: date-time

    EventoQuery:
      type: object
      properties:
        page:
          type: integer
          default: 1
        limit:
          type: integer
          default: 20
        q:
          type: string
        categoriaId:
          type: string
          default: eventos
        subcategoriaId:
          type: string
        barrioId:
          type: string
        fechaDesde:
          type: string
          format: date-time
        fechaHasta:
          type: string
          format: date-time
        precioTipo:
          type: string
          enum: [gratis, pago, donacion, invitacion]
        estado:
          type: string
          enum: [borrador, programado, en_curso, finalizado, cancelado, suspendido]
          default: programado
        destacado:
          type: boolean

    # — auth + usuarios schemas (change auth-usuarios) —

    Rol:
      type: string
      enum: [admin, owner, member]
      description: |
        Closed `Rol` enum, defined at
        `backend/src/modules/usuarios/domain/rol.enum.ts`. The legacy values
        `'admin' | 'empresa' | 'usuario'` (roles-rename) were renamed to
        `'admin' | 'owner' | 'member'`. Default `'member'` on registration.

    AuthContext:
      type: object
      description: |
        The authenticated principal travelling on `request.user` after
        `JwtAuthGuard` verifies the Firebase Auth `idToken`. Constructed by
        `AuthService.buildContext(decodedToken)`. Read-only — never accepted
        in request bodies.
      properties:
        uid:
          type: string
          description: Verified Firebase Auth UID of the caller.
        email:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        placeId:
          type: string
          nullable: true
          description: |
            Reference to the `places` document the user owns. Present when
            `rol === 'owner'`; MUST be `null`/omitted for `'admin'` and
            `'member'`.

    Usuario:
      type: object
      description: Document in the Firestore `usuarios` collection.
      properties:
        id:
          type: string
          description: Firebase Auth UID (PK).
        email:
          type: string
          format: email
          description: UNIQUE email. Validated server-side on create.
        nombre:
          type: string
          minLength: 2
          maxLength: 100
          description: Display name.
        rol:
          $ref: '#/components/schemas/Rol'
        placeId:
          type: string
          nullable: true
          description: |
            Reference to the `places` document the user owns. Set when and
            only when `rol === 'owner'`.
        telefono:
          type: string
          nullable: true
          description: Chilean-format phone (free string).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUsuario:
      type: object
      description: |
        Admin-only request to provision a `usuarios` document for an existing
        Firebase Auth user. Self-registration is deferred (see change
        `usuarios-self-signup`).
      required: [email, nombre]
      properties:
        email:
          type: string
          format: email
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        rol:
          $ref: '#/components/schemas/Rol'
          default: member
        placeId:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true

    UpdatePerfil:
      type: object
      description: |
        Self-service update for the authenticated user's profile. `rol` and
        `placeId` are NOT accepted — they are admin-only (`UpdateRol` /
        admin provisioning). The global `ValidationPipe` with
        `forbidNonWhitelisted: true` rejects any other field with `400`.
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        telefono:
          type: string
          nullable: true

    UpdateRol:
      type: object
      description: |
        Admin-only mutation of a user's `rol`. Validated against the closed
        `Rol` enum server-side; any value outside `[admin, owner, member]`
        receives `400` with message `rol must be one of: admin, owner, member`.
      required: [rol]
      properties:
        rol:
          $ref: '#/components/schemas/Rol'

    SolicitudApproveRejectBody:
      type: object
      description: |
        Optional body for `POST /solicitudes/{id}/approve|reject`. `comentarios`
        is the admin's free-text rejection/approval note (only meaningful for
        `reject`). Approve silently ignores `comentarios` when sent. Any other
        property receives `400` `property X should not exist`.
      properties:
        comentarios:
          type: string
          maxLength: 500

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: API operativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /places:
    get:
      summary: Listar places (paginado, filtros)
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: categoriaId
          in: query
          schema: { type: string }
        - name: barrioId
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pendiente, aprobado, rechazado] }
      responses:
        "200":
          description: Lista de places
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Place'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        "401":
          $ref: '#/components/schemas/Error'
    post:
      summary: Crear place
      security:
        - bearerAuth: []
      description: |
        Authenticated route. The caller MUST have `rol === 'owner'` (enforced
        by `RolesGuard`), and `places.usuarioId` is sourced from the verified
        JWT `uid` (via `@CurrentUser()`). The body MUST NOT include
        `usuarioId` (forbidNonWhitelisted — `400` if present).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlace'
      responses:
        "201":
          description: Place creado — `usuarioId` set from the verified JWT uid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'owner'` (e.g., `'member'`)
          $ref: '#/components/schemas/Error'
        "409":
          description: Slug duplicado
          $ref: '#/components/schemas/Error'

  /places/{id}:
    get:
      summary: Obtener place por id
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        "404":
          $ref: '#/components/schemas/Error'
    put:
      summary: Actualizar place
      security:
        - bearerAuth: []
      description: |
        Authenticated. In MVP returns `200` for the owner or admin; the
        fine-grained `owner`/`admin` guards for `PUT /places/{id}` and
        `DELETE /places/{id}` are introduced by a future
        `places-clean-arch-refactor` change (out of scope for
        `auth-usuarios`). This change only updates the `POST /places`
        protection (see above).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlace'
      responses:
        "200":
          description: Place actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        "401":
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'
    delete:
      summary: Eliminar place
      security:
        - bearerAuth: []
      description: Same MVP caveat as `PUT /places/{id}` — auth introduced here, fine-grained guards deferred.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: string
        "401":
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'
        "409":
          description: "No se puede eliminar: existen solicitudes asociadas"
          $ref: '#/components/schemas/Error'

  /places/slug/{slug}:
    get:
      summary: Obtener place por slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        "404":
          $ref: '#/components/schemas/Error'

  /places/map-data:
    get:
      summary: Obtener datos ligeros para mapa interactivo
      security: []
      responses:
        "200":
          description: Array de places con coordenadas para marcadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MapDataItem'

  /places/{id}/abierto-ahora:
    get:
      summary: Verificar si el place está abierto ahora (zona horaria America/Santiago)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Estado de apertura actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbiertoAhoraResponse'
        "404":
          $ref: '#/components/schemas/Error'

  /eventos:
    get:
      summary: Listar eventos (paginado, filtros, solo status aprobado)
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: q
          in: query
          schema: { type: string }
        - name: categoriaId
          in: query
          schema: { type: string, default: eventos }
        - name: subcategoriaId
          in: query
          schema: { type: string }
        - name: barrioId
          in: query
          schema: { type: string }
        - name: fechaDesde
          in: query
          schema: { type: string, format: date-time }
        - name: fechaHasta
          in: query
          schema: { type: string, format: date-time }
        - name: precioTipo
          in: query
          schema: { type: string, enum: [gratis, pago, donacion, invitacion] }
        - name: estado
          in: query
          schema: { type: string, enum: [borrador, programado, en_curso, finalizado, cancelado, suspendido], default: programado }
        - name: destacado
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Evento'
                  meta:
                    $ref: '#/components/schemas/Pagination'
    post:
      summary: Crear evento
      security:
        - bearerAuth: []
      description: |
        Authenticated. `rol === 'owner'` or `rol === 'admin'` (enforced by
        `RolesGuard`). `eventos.usuarioId` is sourced from the verified JWT
        `uid` (via `@CurrentUser()`). The provisional `x-usuario-id` header
        (auth debt from `roles-rename`) is removed by the `auth-usuarios`
        change — any such header is silently ignored. Body MUST NOT include
        `usuarioId` (forbidNonWhitelisted — `400`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvento'
      responses:
        "201":
          description: Evento creado — `usuarioId` set from the verified JWT uid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is `'member'` (create is owner/admin-only)
          $ref: '#/components/schemas/Error'
        "409":
          description: Slug duplicado
          $ref: '#/components/schemas/Error'

  /eventos/map-data:
    get:
      summary: Obtener datos ligeros de eventos para mapa interactivo
      security: []
      responses:
        "200":
          description: Array de eventos con coordenadas para marcadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoMapDataItem'

  /eventos/{id}:
    get:
      summary: Obtener evento por id (solo status aprobado para público)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        "404":
          $ref: '#/components/schemas/Error'
    put:
      summary: Actualizar evento
      security:
        - bearerAuth: []
      description: |
        Authenticated. `rol === 'owner'` or `rol === 'admin'` (enforced by
        `RolesGuard`). Owner can only update their own eventos
        (`evento.usuarioId === verified JWT uid`); otherwise `403`. Admin
        can update any evento. `usuarioId` is sourced from the JWT (via
        `@CurrentUser()`) — the `x-usuario-id` header is removed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEvento'
      responses:
        "200":
          description: Evento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'
    delete:
      summary: Eliminar evento
      security:
        - bearerAuth: []
      description: |
        Authenticated. `rol === 'owner'` or `rol === 'admin'` (enforced by
        `RolesGuard`). Owner can only delete their own eventos; otherwise
        `403`. Admin can delete any evento.

        **BREAKING (change `auth-usuarios`)**: the `x-usuario-id` and `x-rol`
        request headers from the original `eventos-crud` implementation are
        removed; callers MUST send `Authorization: Bearer <idToken>`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: string
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'
        "409":
          description: "No se puede eliminar: existen solicitudes pendientes asociadas"
          $ref: '#/components/schemas/Error'

  /eventos/slug/{slug}:
    get:
      summary: Obtener evento por slug (solo status aprobado para público)
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        "404":
          $ref: '#/components/schemas/Error'

  # — auth + usuarios paths (change auth-usuarios) —

  /usuarios/me:
    get:
      summary: Get the authenticated user's own profile
      security:
        - bearerAuth: []
      description: |
        Returns the `usuarios` document matching the verified JWT `uid`. Any
        authenticated role (`'admin'`, `'owner'`, `'member'`) can access
        their own profile — no `@Roles` enforcement.
      responses:
        "200":
          description: The caller's `Usuario` document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: |
            The verified Firebase Auth UID has no matching `usuarios`
            document (orphan — needs admin provisioning before accessing
            any authenticated endpoint).
          $ref: '#/components/schemas/Error'
    put:
      summary: Update the authenticated user's own profile (self-service)
      security:
        - bearerAuth: []
      description: |
        Self-service update of `nombre` and `telefono`. The body accepts
        ONLY `{ nombre?, telefono? }`. `rol` and `placeId` are NOT accepted
        — they are admin-only. The global `ValidationPipe` with
        `forbidNonWhitelisted: true` rejects any other field with `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePerfil'
      responses:
        "200":
          description: Updated `Usuario` document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Orphan user (no `usuarios` document).
          $ref: '#/components/schemas/Error'

  /usuarios:
    get:
      summary: List all usuarios (admin-only)
      security:
        - bearerAuth: []
      description: |
        Admin-only. Returns all `usuarios` documents. `@Roles('admin')`
        enforces the role; non-admins receive `403`.
      parameters:
        - name: rol
          in: query
          schema: { $ref: '#/components/schemas/Rol' }
          description: Optional filter by rol.
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'admin'`.
          $ref: '#/components/schemas/Error'
    post:
      summary: Provision a new usuarios document (admin-only)
      security:
        - bearerAuth: []
      description: |
        Admin-only. Provisions a `usuarios` document for an existing
        Firebase Auth user (the Firebase Auth signup happens client-side;
        this endpoint writes the matching `usuarios` row). Default
        `rol: 'member'` if omitted. Email uniqueness is enforced server-side
        (`ConflictException`/`409`). Self-registration is deferred to a
        future `usuarios-self-signup` change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUsuario'
      responses:
        "201":
          description: Usuario created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'admin'`.
          $ref: '#/components/schemas/Error'
        "409":
          description: A `usuarios` document with that `email` already exists.
          $ref: '#/components/schemas/Error'

  /usuarios/{uid}:
    get:
      summary: Get a usuarios document by UID (admin-only)
      security:
        - bearerAuth: []
      description: Admin-only. `@Roles('admin')` enforces; non-admins receive `403`.
      parameters:
        - name: uid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Usuario document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'admin'`.
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'

  /usuarios/{uid}/rol:
    put:
      summary: Update a user's rol (admin-only, validates closed enum)
      security:
        - bearerAuth: []
      description: |
        Admin-only. Body MUST be `{ rol: 'admin'|'owner'|'member' }`.
        Validated against `ROL_VALUES` `@IsEnum` — any other value
        receives `400` with message `rol must be one of: admin, owner, member`.
        Non-admins receive `403`.
      parameters:
        - name: uid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRol'
      responses:
        "200":
          description: Updated `Usuario` document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        "400":
          description: Body's `rol` is not in `[admin, owner, member]`.
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'admin'`.
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'

  # — solicitudes approve/reject paths (change auth-usuarios) —

  /solicitudes/{id}/approve:
    post:
      summary: Aprobar una solicitud (admin-only)
      security:
        - bearerAuth: []
      description: |
        Admin-only. `@Roles('admin')` enforced by `RolesGuard`. The solicitud
        transitions to `status: 'aprobado'`, `revisadoPor: <caller uid>`
        (from `@CurrentUser()`), `revisadoAt: <now>`. The side-effect
        propagates to the linked `places`/`eventos` document via the
        existing `SolicitudesService.approve` handler. Returns `409` if the
        solicitud is not `'pendiente'`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Solicitud aprobada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum: [aprobado]
                  revisadoPor:
                    type: string
                  revisadoAt:
                    type: string
                    format: date-time
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'admin'`.
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'
        "409":
          description: Solicitud is not `'pendiente'`.
          $ref: '#/components/schemas/Error'

  /solicitudes/{id}/reject:
    post:
      summary: Rechazar una solicitud (admin-only)
      security:
        - bearerAuth: []
      description: |
        Admin-only. `@Roles('admin')` enforced by `RolesGuard`. Body accepts
        `{ comentarios?: string }` (admin's free-text rejection note;
        max 500 chars). Any other body property receives `400`
        (`forbidNonWhitelisted`). The solicitud transitions to
        `status: 'rechazado'`, `revisadoPor: <caller uid>`,
        `revisadoAt: <now>`, `comentarios: <body>`. Returns `409` if not `'pendiente'`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudApproveRejectBody'
      responses:
        "200":
          description: Solicitud rechazada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum: [rechazado]
                  revisadoPor:
                    type: string
                  revisadoAt:
                    type: string
                    format: date-time
                  comentarios:
                    type: string
                    nullable: true
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'admin'`.
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'
        "409":
          description: Solicitud is not `'pendiente'`.
          $ref: '#/components/schemas/Error'