openapi: 3.0.3
info:
  title: Directorio Concón API
  description: |
    API REST para el Directorio de Lugares de Concón (NestJS + Firebase Firestore).
    Contrato entre frontend y backend — actualizar ANTES de implementar cambios.
  version: "1.0.0"
  contact:
    name: Agencia Digital
    url: https://agencia-digital.cl
    email: desarrollo@agencia-digital.cl

servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
  - url: https://api.directorio-concon.com/v1
    description: Producción (VPS Docker)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de Firebase Auth (idToken)

  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Coordenadas:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number

    Turno:
      type: object
      required: [apertura, cierre]
      properties:
        apertura:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          example: "09:00"
        cierre:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          example: "14:00"

    HorarioDia:
      type: object
      required: [dia, abierto, turnos]
      properties:
        dia:
          type: string
          enum: [lunes, martes, miercoles, jueves, viernes, sabado, domingo]
        abierto:
          type: boolean
        turnos:
          type: array
          items:
            $ref: '#/components/schemas/Turno'

    HorarioEspecial:
      type: object
      required: [fecha, descripcion, turnos]
      properties:
        fecha:
          type: string
          format: date
          example: "2025-12-31"
        descripcion:
          type: string
          example: "Noche de Año Nuevo"
        turnos:
          type: array
          items:
            $ref: '#/components/schemas/Turno'

    RedSocial:
      type: object
      required: [plataforma, url]
      properties:
        plataforma:
          type: string
          enum: [instagram, facebook, x-twitter, linkedin, tiktok, youtube]
          description: |
            Closed enum. The legacy 'twitter' value was migrated to 'x-twitter'
            (reflecting the 2023 platform rename). Clients sending 'twitter'
            receive a 400; they must update to 'x-twitter'. Consistent with
            docs/data-model.md PlataformaSocialEnum and the backend VO/DTO.
        url:
          type: string
          format: uri

    Imagenes:
      type: object
      properties:
        logo:
          type: string
          format: uri
          nullable: true
        portada:
          type: string
          format: uri
          nullable: true
        galeria:
          type: array
          items:
            type: string
            format: uri

    ValoracionGoogle:
      type: object
      properties:
        rating:
          type: number
          minimum: 0
          maximum: 5
        reviewsCount:
          type: integer
          minimum: 0
        mapsLink:
          type: string
          format: uri

    Place:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        nombre:
          type: string
        descripcionCorta:
          type: string
          maxLength: 140
        descripcion:
          type: string
        categoriaId:
          type: string
        subcategoriaId:
          type: string
          nullable: true
        barrioId:
          type: string
        direccion:
          type: string
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        telefono:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        sitioWeb:
          type: string
          format: uri
          nullable: true
        redesSociales:
          type: array
          items:
            $ref: '#/components/schemas/RedSocial'
          maxItems: 3
        imagenes:
          $ref: '#/components/schemas/Imagenes'
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/HorarioDia'
        horariosEspeciales:
          type: array
          items:
            $ref: '#/components/schemas/HorarioEspecial'
        abierto24x7:
          type: boolean
        servicios:
          type: array
          items:
            type: string
            enum: [wifi, estacionamiento, acceso-discapacidad, apto-mascotas, delivery, take-away, terraza, vista-al-mar, reservas, ninos-bienvenida]
        metodosPago:
          type: array
          items:
            type: string
            enum: [efectivo, debito, credito, transferencia, qr]
        idiomas:
          type: array
          items:
            type: string
        activo:
          type: boolean
          description: Soft-delete flag (default true). When false, hidden from public directory.
        estadoVerificacion:
          type: string
          enum: [pendiente, verificado, rechazado]
          description: Verification state. 'verificado' = green badge, 'rechazado' = place deactivated.
        motivoRechazoVerificacion:
          type: string
          nullable: true
          description: Required when estadoVerificacion === 'rechazado'.
        gestionadoPorAdmin:
          type: boolean
          description: true if created by admin (not via owner self-service).
        destacado:
          type: boolean
        planId:
          type: string
          enum: [gratuito, premium]
        vistasTotales:
          type: integer
          minimum: 0
        valoracionGoogle:
          $ref: '#/components/schemas/ValoracionGoogle'
        usuarioId:
          type: string
        fechaPublicacion:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePlace:
      type: object
      required: [nombre, descripcionCorta, descripcion, categoriaId, barrioId, direccion, planId]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        descripcionCorta:
          type: string
          minLength: 1
          maxLength: 140
        descripcion:
          type: string
          minLength: 10
          maxLength: 2000
        categoriaId:
          type: string
        subcategoriaId:
          type: string
          nullable: true
        barrioId:
          type: string
        direccion:
          type: string
          maxLength: 200
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        telefono:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        sitioWeb:
          type: string
          format: uri
          nullable: true
        redesSociales:
          type: array
          items:
            $ref: '#/components/schemas/RedSocial'
          maxItems: 3
        imagenes:
          $ref: '#/components/schemas/Imagenes'
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/HorarioDia'
        horariosEspeciales:
          type: array
          items:
            $ref: '#/components/schemas/HorarioEspecial'
        abierto24x7:
          type: boolean
          default: false
        servicios:
          type: array
          items:
            type: string
            enum: [wifi, estacionamiento, acceso-discapacidad, apto-mascotas, delivery, take-away, terraza, vista-al-mar, reservas, ninos-bienvenida]
        metodosPago:
          type: array
          items:
            type: string
            enum: [efectivo, debito, credito, transferencia, qr]
        idiomas:
          type: array
          items:
            type: string
        planId:
          type: string
          enum: [gratuito, premium]

    UpdatePlace:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        descripcionCorta:
          type: string
          maxLength: 140
        descripcion:
          type: string
          maxLength: 2000
        direccion:
          type: string
          maxLength: 200
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        telefono:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        sitioWeb:
          type: string
          format: uri
          nullable: true
        redesSociales:
          type: array
          items:
            $ref: '#/components/schemas/RedSocial'
          maxItems: 3
        imagenes:
          $ref: '#/components/schemas/Imagenes'
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/HorarioDia'
        horariosEspeciales:
          type: array
          items:
            $ref: '#/components/schemas/HorarioEspecial'
        abierto24x7:
          type: boolean
        servicios:
          type: array
          items:
            type: string
            enum: [wifi, estacionamiento, acceso-discapacidad, apto-mascotas, delivery, take-away, terraza, vista-al-mar, reservas, ninos-bienvenida]
        metodosPago:
          type: array
          items:
            type: string
            enum: [efectivo, debito, credito, transferencia, qr]
        idiomas:
          type: array
          items:
            type: string
        destacado:
