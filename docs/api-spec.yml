openapi: 3.0.3
info:
  title: Directorio Concón API
  description: |
    API REST para el Directorio de Lugares de Concón (NestJS + Firebase Firestore).
    Contrato entre frontend y backend — actualizar ANTES de implementar cambios.
  version: "1.0.0"
  contact:
    name: Agencia Digital
    url: https://agencia-digital.cl
    email: desarrollo@agencia-digital.cl

servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
  - url: https://api.directorio-concon.com/v1
    description: Producción (VPS Docker)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de Firebase Auth (idToken)

  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Coordenadas:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number

    Turno:
      type: object
      required: [apertura, cierre]
      properties:
        apertura:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          example: "09:00"
        cierre:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          example: "14:00"

    HorarioDia:
      type: object
      required: [dia, abierto, turnos]
      properties:
        dia:
          type: string
          enum: [lunes, martes, miercoles, jueves, viernes, sabado, domingo]
        abierto:
          type: boolean
        turnos:
          type: array
          items:
            $ref: '#/components/schemas/Turno'

    HorarioEspecial:
      type: object
      required: [fecha, descripcion, turnos]
      properties:
        fecha:
          type: string
          format: date
          example: "2025-12-31"
        descripcion:
          type: string
          example: "Noche de Año Nuevo"
        turnos:
          type: array
          items:
            $ref: '#/components/schemas/Turno'

    RedSocial:
      type: object
      required: [plataforma, url]
      properties:
        plataforma:
          type: string
          enum: [instagram, facebook, twitter, linkedin, tiktok, youtube]
        url:
          type: string
          format: uri

    Imagenes:
      type: object
      properties:
        logo:
          type: string
          format: uri
          nullable: true
        portada:
          type: string
          format: uri
          nullable: true
        galeria:
          type: array
          items:
            type: string
            format: uri

    ValoracionGoogle:
      type: object
      properties:
        rating:
          type: number
          minimum: 0
          maximum: 5
        reviewsCount:
          type: integer
          minimum: 0
        mapsLink:
          type: string
          format: uri

    Place:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        nombre:
          type: string
        descripcionCorta:
          type: string
          maxLength: 140
        descripcion:
          type: string
        categoriaId:
          type: string
        subcategoriaId:
          type: string
          nullable: true
        barrioId:
          type: string
        direccion:
          type: string
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        telefono:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        sitioWeb:
          type: string
          format: uri
          nullable: true
        redesSociales:
          type: array
          items:
            $ref: '#/components/schemas/RedSocial'
          maxItems: 3
        imagenes:
          $ref: '#/components/schemas/Imagenes'
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/HorarioDia'
        horariosEspeciales:
          type: array
          items:
            $ref: '#/components/schemas/HorarioEspecial'
        abierto24x7:
          type: boolean
        servicios:
          type: array
          items:
            type: string
            enum: [wifi, estacionamiento, acceso-discapacidad, apto-mascotas, delivery, take-away, terraza, vista-al-mar, reservas, ninos-bienvenida]
        metodosPago:
          type: array
          items:
            type: string
            enum: [efectivo, debito, credito, transferencia, qr]
        idiomas:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pendiente, aprobado, rechazado]
        verificado:
          type: boolean
        fechaVerificacion:
          type: string
          format: date-time
          nullable: true
        destacado:
          type: boolean
        planId:
          type: string
          enum: [gratuito, premium]
        vistasTotales:
          type: integer
          minimum: 0
        valoracionGoogle:
          $ref: '#/components/schemas/ValoracionGoogle'
        usuarioId:
          type: string
        fechaPublicacion:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePlace:
      type: object
      required: [nombre, descripcionCorta, descripcion, categoriaId, barrioId, direccion, planId]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        descripcionCorta:
          type: string
          minLength: 1
          maxLength: 140
        descripcion:
          type: string
          minLength: 10
          maxLength: 2000
        categoriaId:
          type: string
        subcategoriaId:
          type: string
          nullable: true
        barrioId:
          type: string
        direccion:
          type: string
          maxLength: 200
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        telefono:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        sitioWeb:
          type: string
          format: uri
          nullable: true
        redesSociales:
          type: array
          items:
            $ref: '#/components/schemas/RedSocial'
          maxItems: 3
        imagenes:
          $ref: '#/components/schemas/Imagenes'
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/HorarioDia'
        horariosEspeciales:
          type: array
          items:
            $ref: '#/components/schemas/HorarioEspecial'
        abierto24x7:
          type: boolean
          default: false
        servicios:
          type: array
          items:
            type: string
            enum: [wifi, estacionamiento, acceso-discapacidad, apto-mascotas, delivery, take-away, terraza, vista-al-mar, reservas, ninos-bienvenida]
        metodosPago:
          type: array
          items:
            type: string
            enum: [efectivo, debito, credito, transferencia, qr]
        idiomas:
          type: array
          items:
            type: string
        planId:
          type: string
          enum: [gratuito, premium]
        usuarioId:
          type: string

    UpdatePlace:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        descripcionCorta:
          type: string
          maxLength: 140
        descripcion:
          type: string
          maxLength: 2000
        direccion:
          type: string
          maxLength: 200
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        telefono:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        sitioWeb:
          type: string
          format: uri
          nullable: true
        redesSociales:
          type: array
          items:
            $ref: '#/components/schemas/RedSocial'
          maxItems: 3
        imagenes:
          $ref: '#/components/schemas/Imagenes'
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/HorarioDia'
        horariosEspeciales:
          type: array
          items:
            $ref: '#/components/schemas/HorarioEspecial'
        abierto24x7:
          type: boolean
        servicios:
          type: array
          items:
            type: string
            enum: [wifi, estacionamiento, acceso-discapacidad, apto-mascotas, delivery, take-away, terraza, vista-al-mar, reservas, ninos-bienvenida]
        metodosPago:
          type: array
          items:
            type: string
            enum: [efectivo, debito, credito, transferencia, qr]
        idiomas:
          type: array
          items:
            type: string
        destacado:
          type: boolean
        planId:
          type: string
          enum: [gratuito, premium]

    AbiertoAhoraResponse:
      type: object
      required: [abierto]
      properties:
        abierto:
          type: boolean
        turno:
          $ref: '#/components/schemas/Turno'

    MapDataItem:
      type: object
      required: [id, slug, nombre, coordenadas, categoriaId, barrioId]
      properties:
        id:
          type: string
        slug:
          type: string
        nombre:
          type: string
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        categoriaId:
          type: string
        barrioId:
          type: string

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: API operativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /places:
    get:
      summary: Listar places (paginado, filtros)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: categoriaId
          in: query
          schema: { type: string }
        - name: barrioId
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pendiente, aprobado, rechazado] }
      responses:
        "200":
          description: Lista de places
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Place'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        "401":
          $ref: '#/components/schemas/Error'
    post:
      summary: Crear place
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlace'
      responses:
        "201":
          description: Place creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "409":
          description: Slug duplicado
          $ref: '#/components/schemas/Error'

  /places/{id}:
    get:
      summary: Obtener place por id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        "404":
          $ref: '#/components/schemas/Error'
    put:
      summary: Actualizar place
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlace'
      responses:
        "200":
          description: Place actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        "404":
          $ref: '#/components/schemas/Error'
    delete:
      summary: Eliminar place
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: string
        "404":
          $ref: '#/components/schemas/Error'
        "409":
          description: No se puede eliminar: existen solicitudes asociadas
          $ref: '#/components/schemas/Error'

  /places/slug/{slug}:
    get:
      summary: Obtener place por slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        "404":
          $ref: '#/components/schemas/Error'

  /places/map-data:
    get:
      summary: Obtener datos ligeros para mapa interactivo
      responses:
        "200":
          description: Array de places con coordenadas para marcadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MapDataItem'
        "401":
          $ref: '#/components/schemas/Error'

  /places/{id}/abierto-ahora:
    get:
      summary: Verificar si el place está abierto ahora (zona horaria America/Santiago)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Estado de apertura actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbiertoAhoraResponse'
        "404":
          $ref: '#/components/schemas/Error'