    # — auth + usuarios schemas (changes auth-usuarios, auth-usuarios-v2) —

    Rol:
      type: string
      enum: [admin, owner, member]
      description: |
        Closed `Rol` enum, defined at
        `backend/src/modules/auth/domain/rol.enum.ts`. The legacy values
        `'admin' | 'empresa' | 'usuario'` (roles-rename) were renamed to
        `'admin' | 'owner' | 'member'`.

    RegisterRol:
      type: string
      enum: [member, owner]
      description: |
        Subset of `Rol` accepted by the public self-registration endpoint
        `POST /auth/registro` (change `auth-usuarios-v2`). `admin` is NOT
        accepted via API; the first admin is provisioned by the `seed-admin`
        script. A client sending `rol: 'admin'` receives `400`.

    AuthContext:
      type: object
      description: |
        The authenticated principal travelling on `request.user` after
        `JwtAuthGuard` verifies the Firebase Auth `idToken`. Constructed by
        `AuthService.buildContext(decodedToken)`. Read-only — never accepted
        in request bodies. The `placeId` field was REMOVED in
        `auth-usuarios-v2` (the user→place relation is resolved via a
        `places` query by `usuarioId`, the single source of truth).
      properties:
        uid:
          type: string
          description: Verified Firebase Auth UID of the caller.
        email:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'

    Usuario:
      type: object
      description: Document in the Firestore `usuarios` collection.
      properties:
        id:
          type: string
          description: Firebase Auth UID (PK).
        email:
          type: string
          format: email
          description: UNIQUE email. Validated server-side on create.
        nombre:
          type: string
          minLength: 2
          maxLength: 100
          description: Display name.
        rol:
          $ref: '#/components/schemas/Rol'
        telefono:
          type: string
          nullable: true
          description: Chilean-format phone (free string).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterDto:
      type: object
      description: |
        Public self-registration request (change `auth-usuarios-v2`). Creates a
        Firebase Auth user and the matching `usuarios/{uid}` document in a
        single backend call (Admin SDK). `rol` accepts ONLY `member` or
        `owner`; `admin` is rejected with `400` (the first admin is
        provisioned by the `seed-admin` script).
      required: [email, password, nombre, rol]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Minimum 8 characters.
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        rol:
          $ref: '#/components/schemas/RegisterRol'

    RegisterResult:
      type: object
      description: Response body for `POST /auth/registro` (201).
      required: [uid, email, rol, nombre]
      properties:
        uid:
          type: string
          description: Created Firebase Auth UID.
        email:
          type: string
          format: email
        nombre:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'

    UpdatePerfil:
      type: object
      description: |
        Self-service update for the authenticated user's profile. `rol` is NOT
        accepted — it is admin-only (`UpdateRol`). The global `ValidationPipe`
        with `forbidNonWhitelisted: true` rejects any other field with `400`.
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        telefono:
          type: string
          nullable: true

    UpdateRol:
      type: object
      description: |
        Admin-only mutation of a user's `rol`. The `rol` value is restricted to
        `admin` or `member` (change `auth-usuarios-v2`): the `owner` rol is
        acquired exclusively via self-registration (`POST /auth/registro`) and
        cannot be assigned by an admin. Any value outside `[admin, member]`
        receives `400` with message `rol must be one of: admin, member`.
        Transitions out of `owner` are deferred to the `places-refactor` change
        (CH-03), which decides what happens to the owner's places.
      required: [rol]
      properties:
        rol:
          type: string
          enum: [admin, member]
          description: Restricted enum — `owner` is NOT accepted here.

    SolicitudApproveRejectBody:
      type: object
      description: |
        Optional body for `POST /solicitudes/{id}/approve|reject`. `comentarios`
        is the admin's free-text rejection/approval note (only meaningful for
        `reject`). Approve silently ignores `comentarios` when sent. Any other
        property receives `400` `property X should not exist`.
      properties:
        comentarios:
          type: string
          maxLength: 500

    Subcategoria:
      type: object
      required: [slug, nombre]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          example: restaurantes
        nombre:
          type: string
          example: Restaurantes
        activo:
          type: boolean
          description: Solo visible en modo admin. El público no recibe este flag.

    Categoria:
      type: object
      required: [id, nombre, slug, icono, orden]
      properties:
        id:
          type: string
          description: Firestore document id (= slug)
        nombre:
          type: string
          example: Gastronomía
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        descripcion:
          type: string
          nullable: true
        icono:
          type: string
          enum: [utensils, store, tent, briefcase, car, heart-pulse, graduation-cap, building-2, party-popper]
        color:
          type: string
          nullable: true
        orden:
          type: integer
          minimum: 1
          maximum: 99
        activo:
          type: boolean
          description: Solo visible en modo admin. El público no recibe este flag.
        subcategorias:
          type: array
          items:
            $ref: '#/components/schemas/Subcategoria'

    CreateCategoria:
      type: object
      description: |
        Body para `POST /api/v1/categorias` (admin). `id` y `activo` se
        rechazan con `400` (`property X should not exist`); el id del doc se
        deriva del slug.
      required: [nombre, slug, icono, orden]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 80
          example: Gastronomía
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          maxLength: 80
          example: gastronomia
        icono:
          type: string
          enum: [utensils, store, tent, briefcase, car, heart-pulse, graduation-cap, building-2, party-popper]
        orden:
          type: integer
          minimum: 1
          maximum: 99
        descripcion:
          type: string
          maxLength: 500
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'

    UpdateCategoria:
      type: object
      description: |
        Body para `PATCH /api/v1/categorias/:id` (admin). Todos los campos
        opcionales; `slug` e `id` no se renombran post-create. `orden` con
        duplicado recibe `409`.
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 80
        descripcion:
          type: string
          maxLength: 500
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        icono:
          type: string
          enum: [utensils, store, tent, briefcase, car, heart-pulse, graduation-cap, building-2, party-popper]
        orden:
          type: integer
          minimum: 1
          maximum: 99
        activo:
          type: boolean

    CreateSubcategoria:
      type: object
      description: |
        Body para `POST /api/v1/categorias/:id/subcategorias` (admin).
        `activo` es opcional (default `true`); los toggles van por endpoints
        dedicados.
      required: [slug, nombre]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          minLength: 2
          maxLength: 60
          example: restaurantes
        nombre:
          type: string
          minLength: 2
          maxLength: 80
          example: Restaurantes
        activo:
          type: boolean

    Barrio:
      type: object
      required: [id, nombre, slug, tipo]
      properties:
        id:
          type: string
          description: Firestore document id (= slug)
        nombre:
          type: string
          example: Higuerillas
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        tipo:
          type: string
          enum: [urbano, rural]
        descripcion:
          type: string
          nullable: true
        territorio:
          type: string
          nullable: true
        codigo:
          type: string
          nullable: true
        coordenadas:
          allOf:
            - $ref: '#/components/schemas/Coordenadas'
          nullable: true
        activo:
          type: boolean
          description: Solo visible en modo admin. El público no recibe este flag.

    CreateBarrio:
      type: object
      description: |
        Body para `POST /api/v1/barrios` (admin). `id` y `activo` se rechazan
        con `400` (`property X should not exist`).
      required: [nombre, slug, tipo]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 80
          example: Higuerillas
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          maxLength: 80
          example: higuerillas
        tipo:
          type: string
          enum: [urbano, rural]
        descripcion:
          type: string
          maxLength: 500
        territorio:
          type: string
          maxLength: 200
        codigo:
          type: string
        coordenadas:
          type: string
          description: String `"lat,lng"` (se parsea en el service).
          pattern: '^-?\d+(\.\d+)?,\s*-?\d+(\.\d+)?$'

    UpdateBarrio:
      type: object
      description: |
        Body para `PATCH /api/v1/barrios/:id` (admin). Todos los campos
        opcionales; `slug` no se modifica.
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 80
        tipo:
          type: string
          enum: [urbano, rural]
        descripcion:
          type: string
          maxLength: 500
        territorio:
          type: string
          maxLength: 200
        codigo:
          type: string
        coordenadas:
          type: string
          description: String `"lat,lng"` (se parsea en el service).

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: API operativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /categorias:
    get:
      summary: Listar categorías
      description: |
        Sin query → modo admin (incluye inactivas con flag `activo`).
        `?activa=true` → modo público: solo `activo: true` y sin flags
        internos en categoría ni subcategorías.
      security: []
      parameters:
        - name: activa
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
    post:
      summary: Crear categoría (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoria'
      responses:
        "201":
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        "400":
          description: Validación DTO fallida (slug/icono/orden inválidos o propiedad no whitelisted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: No autenticado
        "403":
          description: No admin
        "409":
          description: Slug u orden duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categorias/{id}:
    patch:
      summary: Actualizar categoría (admin)
      description: "`slug` e `id` no se renombran post-create. `orden` con duplicado → 409."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoria'
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        "400":
          description: Validación fallida
        "401":
          description: No autenticado
        "403":
          description: No admin
        "404":
          description: Categoría no encontrada
        "409":
          description: Orden duplicado

  /categorias/{id}/activar:
    patch:
      summary: Activar categoría (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Categoría activada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        "401":
          description: No autenticado
        "403":
          description: No admin
        "404":
          description: Categoría no encontrada

  /categorias/{id}/desactivar:
    patch:
      summary: Desactivar categoría (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Categoría desactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        "401":
          description: No autenticado
        "403":
          description: No admin
        "404":
          description: Categoría no encontrada

  /categorias/{id}/subcategorias:
    post:
      summary: Agregar subcategoría (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubcategoria'
      responses:
        "201":
          description: Subcategoría agregada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        "400":
          description: Validación fallida
        "401":
          description: No autenticado
        "403":
          description: No admin
        "404":
          description: Categoría no encontrada
        "409":
          description: Subcategoría duplicada en esta categoría

  /categorias/{id}/subcategorias/{subId}/desactivar:
    patch:
      summary: Desactivar subcategoría (admin)
      description: "`subId` es el slug de la subcategoría."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: subId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Subcategoría desactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        "401":
          description: No autenticado
        "403":
          description: No admin
        "404":
          description: Categoría o subcategoría no encontrada

  /barrios:
    get:
      summary: Listar barrios
      description: |
        Sin query → modo admin (incluye inactivos con flag `activo`).
        `?activo=true` → modo público: solo `activo: true` y sin flag interno.
      security: []
      parameters:
        - name: activo
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Lista de barrios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Barrio'
    post:
      summary: Crear barrio (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBarrio'
      responses:
        "201":
          description: Barrio creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Barrio'
        "400":
          description: Validación DTO fallida (slug/tipo inválidos o propiedad no whitelisted)
        "401":
          description: No autenticado
        "403":
          description: No admin
        "409":
          description: Slug duplicado

  /barrios/{id}:
    patch:
      summary: Actualizar barrio (admin)
      description: "`slug` no se modifica."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBarrio'
      responses:
        "200":
          description: Barrio actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Barrio'
        "400":
          description: Validación fallida
        "401":
          description: No autenticado
        "403":
          description: No admin
        "404":
          description: Barrio no encontrado

  /barrios/{id}/activar:
    patch:
      summary: Activar barrio (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Barrio activado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Barrio'
        "401":
          description: No autenticado
        "403":
          description: No admin
        "404":
          description: Barrio no encontrado

  /barrios/{id}/desactivar:
    patch:
      summary: Desactivar barrio (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Barrio desactivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Barrio'
        "401":
          description: No autenticado
        "403":
          description: No admin
        "404":
          description: Barrio no encontrado

  /places:
    get:
      summary: Listar places (paginado, filtros)
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: categoriaId
          in: query
          schema: { type: string }
        - name: barrioId
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: activo
          in: query
          schema: { type: boolean, default: true }
          description: Filter by active status. Default true (only active places).
        - name: estadoVerificacion
          in: query
          schema: { type: string, enum: [pendiente, verificado, rechazado] }
          description: Filter by verification state. Admin-only.
        - name: sinDueno
          in: query
          schema: { type: boolean }
          description: "Filter places without an active owner (usuarioId == null OR gestionadoPorAdmin == true). Admin-only."
      responses:
        "200":
          description: Lista de places
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Place'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        "401":
          $ref: '#/components/schemas/Error'
    post:
      summary: Crear place
      security:
        - bearerAuth: []
      description: |
        Authenticated route. The caller MUST have `rol === 'owner'` (enforced
        by `RolesGuard`), and `places.usuarioId` is sourced from the verified
        JWT `uid` (via `@CurrentUser()`). The body MUST NOT include
        `usuarioId` (forbidNonWhitelisted — `400` if present).

        The place is created with `activo: true` and `estadoVerificacion: 'pendiente'`.
        It is visible in the public directory immediately (no badge). No
        solicitud is auto-created. The owner can later claim admin-created
        places via `POST /places/{id}/reclamar`. Admin verifies via
        `POST /places/{id}/verificar`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlace'
      responses:
        "201":
          description: Place created — activo:true, estadoVerificacion:'pendiente'. usuarioId set from the verified JWT uid. No solicitud auto-created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'owner'` (e.g., `'member'`)
          $ref: '#/components/schemas/Error'
        "409":
          description: Slug duplicado
          $ref: '#/components/schemas/Error'

  /places/{id}:
    get:
      summary: Obtener place por id
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        "404":
          $ref: '#/components/schemas/Error'
    put:
      summary: Actualizar place
      security:
        - bearerAuth: []
      description: |
        Authenticated. The caller MUST have `rol === 'owner'` or
        `rol === 'admin'` (enforced by `RolesGuard`). Ownership rule
        (enforced by `PlacesService`): an `owner` can only update a place
        where `places.usuarioId === token.uid` (`403` otherwise); an
        `admin` can update any place. The body MUST NOT include
        `usuarioId` (forbidNonWhitelisted — `400` if present).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlace'
      responses:
        "200":
          description: Place actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: "Caller's `rol` is `member`, or `owner` updating a place not owned"
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'
        "409":
          description: Slug duplicado on rename
          $ref: '#/components/schemas/Error'
    delete:
      summary: Eliminar place
      security:
        - bearerAuth: []
      description: |
        Authenticated. The caller MUST have `rol === 'owner'` or
        `rol === 'admin'` (enforced by `RolesGuard`). Ownership rule
        **BREAKING (change `places-refactor`)**: soft-delete instead of hard
        delete. The response includes `activo: false`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Place soft-deleted (activo set to false)
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: string
                  activo:
                    type: boolean
                    description: Always false after soft-delete
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: "Caller's `rol` is `member`, or `owner` deleting a place not owned"
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'
        "409":
          description: "No se puede eliminar: existen solicitudes asociadas"
          $ref: '#/components/schemas/Error'

  /places/{id}/reclamar:
    post:
      summary: Reclamar un place como owner (claiming)
      security:
        - bearerAuth: []
      description: |
        Owner-only (`rol === 'owner'`). Creates a `solicitud` of type
        `reclamo-place` with `solicitanteUid = token.uid`. The place MUST
        not have an active owner (`usuarioId == null` OR `gestionadoPorAdmin
        == true`). The caller must NOT be an `admin`. Returns `409` if
        there's already a pending `reclamo-place` for this place by the
        same user. The place remains visible to the public while the
        solicitud is pending.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Solicitud de reclamo creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  solicitudId:
                    type: string
                  status:
                    type: string
                    enum: [pendiente]
                  placeId:
                    type: string
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'owner'`, or admin trying to claim
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'
        "409":
          description: Place already has an owner, or pending reclamo exists
          $ref: '#/components/schemas/Error'

  /places/{id}/verificar:
    post:
      summary: Verificar un place (admin-only)
      security:
        - bearerAuth: []
      description: |
        Admin-only (`rol === 'admin'`). Sets `estadoVerificacion` on the
        place. If `resultado === 'verificado'`: sets
        `estadoVerificacion: 'verificado'` + `fechaPublicacion: <now>`.
        If `resultado === 'rechazado'`: sets `estadoVerificacion: 'rechazado'`
        + `activo: false` + `motivoRechazoVerificacion: <motivo>` (motivo is
        REQUIRED when rechazado). Returns `400` if motivo is missing on
        rechazado.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resultado]
              properties:
                resultado:
                  type: string
                  enum: [verificado, rechazado]
                motivo:
                  type: string
                  maxLength: 500
                  description: Required when resultado === 'rechazado'.
      responses:
        "200":
          description: Place verification updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        "400":
          description: Missing motivo when rechazado, or invalid input
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'admin'`
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'

  /places/slug/{slug}:
    get:
      summary: Obtener place por slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        "404":
          $ref: '#/components/schemas/Error'

  /places/map-data:
    get:
      summary: Obtener datos ligeros para mapa interactivo
      security: []
      responses:
        "200":
          description: Array de places con coordenadas para marcadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MapDataItem'

  /places/{id}/abierto-ahora:
    get:
      summary: Verificar si el place está abierto ahora (zona horaria America/Santiago)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Estado de apertura actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbiertoAhoraResponse'
        "404":
          $ref: '#/components/schemas/Error'

  /eventos:
    get:
      summary: Listar eventos (paginado, filtros, solo status aprobado)
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: q
          in: query
          schema: { type: string }
        - name: categoriaId
          in: query
          schema: { type: string, default: eventos }
        - name: subcategoriaId
          in: query
          schema: { type: string }
        - name: barrioId
          in: query
          schema: { type: string }
        - name: fechaDesde
          in: query
          schema: { type: string, format: date-time }
        - name: fechaHasta
          in: query
          schema: { type: string, format: date-time }
        - name: precioTipo
          in: query
          schema: { type: string, enum: [gratis, pago, donacion, invitacion] }
        - name: estado
          in: query
          schema: { type: string, enum: [borrador, programado, en_curso, finalizado, cancelado, suspendido], default: programado }
        - name: destacado
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Evento'
                  meta:
                    $ref: '#/components/schemas/Pagination'
    post:
      summary: Crear evento
      security:
        - bearerAuth: []
      description: |
        Authenticated. `rol === 'owner'` or `rol === 'admin'` (enforced by
        `RolesGuard`). `eventos.usuarioId` is sourced from the verified JWT
        `uid` (via `@CurrentUser()`). The provisional `x-usuario-id` header
        (auth debt from `roles-rename`) is removed by the `auth-usuarios`
        change — any such header is silently ignored. Body MUST NOT include
        `usuarioId` (forbidNonWhitelisted — `400`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvento'
      responses:
        "201":
          description: Evento creado — `usuarioId` set from the verified JWT uid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is `'member'` (create is owner/admin-only)
          $ref: '#/components/schemas/Error'
        "409":
          description: Slug duplicado
          $ref: '#/components/schemas/Error'

  /eventos/map-data:
    get:
      summary: Obtener datos ligeros de eventos para mapa interactivo
      security: []
      responses:
        "200":
          description: Array de eventos con coordenadas para marcadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoMapDataItem'

  /eventos/{id}:
    get:
      summary: Obtener evento por id (solo status aprobado para público)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        "404":
          $ref: '#/components/schemas/Error'
    put:
      summary: Actualizar evento
      security:
        - bearerAuth: []
      description: |
        Authenticated. `rol === 'owner'` or `rol === 'admin'` (enforced by
        `RolesGuard`). Owner can only update their own eventos
        (`evento.usuarioId === verified JWT uid`); otherwise `403`. Admin
        can update any evento. `usuarioId` is sourced from the JWT (via
        `@CurrentUser()`) — the `x-usuario-id` header is removed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEvento'
      responses:
        "200":
          description: Evento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'
    delete:
      summary: Eliminar evento
      security:
        - bearerAuth: []
      description: |
        Authenticated. `rol === 'owner'` or `rol === 'admin'` (enforced by
        `RolesGuard`). Owner can only delete their own eventos; otherwise
        `403`. Admin can delete any evento.

        **BREAKING (change `auth-usuarios`)**: the `x-usuario-id` and `x-rol`
        request headers from the original `eventos-crud` implementation are
        removed; callers MUST send `Authorization: Bearer <idToken>`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: string
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'
        "409":
          description: "No se puede eliminar: existen solicitudes pendientes asociadas"
          $ref: '#/components/schemas/Error'

  /eventos/slug/{slug}:
    get:
      summary: Obtener evento por slug (solo status aprobado para público)
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        "404":
          $ref: '#/components/schemas/Error'

  # — auth + usuarios paths (changes auth-usuarios, auth-usuarios-v2) —

  /auth/registro:
    post:
      summary: Public self-registration with rol selection (member/owner)
      security: []
      description: |
        Public endpoint (no Bearer token required). Creates a Firebase Auth
        user and the matching `usuarios/{uid}` Firestore document in a single
        backend call (using the Admin SDK). `rol` accepts ONLY `'member'` or
        `'owner'`; a client sending `rol: 'admin'` receives `400` (the first
        admin is provisioned by the `seed-admin` script, never via API).
        Email verification is handled in Firebase Console, not in backend code.
        On a Firestore write failure after the Auth user was created, the
        backend performs a compensating `deleteUser` rollback and responds `500`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        "201":
          description: Usuario created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResult'
        "400":
          description: "Validation error (whitelist + enum; e.g. rol admin, short password)."
          $ref: '#/components/schemas/Error'
        "409":
          description: A Firebase Auth user with that `email` already exists.
          $ref: '#/components/schemas/Error'
        "500":
          description: Internal failure (Auth user created but Firestore write failed — rolled back).
          $ref: '#/components/schemas/Error'

  /usuarios/me:
    get:
      summary: Get the authenticated user's own profile
      security:
        - bearerAuth: []
      description: |
        Returns the `usuarios` document matching the verified JWT `uid`. Any
        authenticated role (`'admin'`, `'owner'`, `'member'`) can access
        their own profile — no `@Roles` enforcement.
      responses:
        "200":
          description: The caller's `Usuario` document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: |
            The verified Firebase Auth UID has no matching `usuarios`
            document (orphan — needs provisioning before accessing
            any authenticated endpoint).
          $ref: '#/components/schemas/Error'
    put:
      summary: Update the authenticated user's own profile (self-service)
      security:
        - bearerAuth: []
      description: |
        Self-service update of `nombre` and `telefono`. The body accepts
        ONLY `{ nombre?, telefono? }`. `rol` is NOT accepted — it is
        admin-only. The global `ValidationPipe` with `forbidNonWhitelisted:
        true` rejects any other field with `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePerfil'
      responses:
        "200":
          description: Updated `Usuario` document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Orphan user (no `usuarios` document).
          $ref: '#/components/schemas/Error'

  /usuarios:
    get:
      summary: List all usuarios (admin-only)
      security:
        - bearerAuth: []
      description: |
        Admin-only. Returns all `usuarios` documents. `@Roles('admin')`
        enforces the role; non-admins receive `403`.
      parameters:
        - name: rol
          in: query
          schema: { $ref: '#/components/schemas/Rol' }
          description: Optional filter by rol.
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'admin'`.
          $ref: '#/components/schemas/Error'
    # NOTE (change auth-usuarios-v2): the `POST /usuarios` admin-provisioning
    # endpoint was REMOVED. User provisioning now happens via the public
    # `POST /auth/registro` (rol ∈ {member, owner}); the first admin is
    # provisioned by the `seed-admin` script (Firebase real).

  /usuarios/{uid}:
    get:
      summary: Get a usuarios document by UID (admin-only)
      security:
        - bearerAuth: []
      description: Admin-only. `@Roles('admin')` enforces; non-admins receive `403`.
      parameters:
        - name: uid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Usuario document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'admin'`.
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'

  /usuarios/{uid}/rol:
    put:
      summary: Update a user's rol (admin-only, restricted to admin|member targets)
      security:
        - bearerAuth: []
      description: |
        Admin-only. Body MUST be `{ rol: 'admin'|'member' }` — the `owner`
        value is NOT accepted here (acquired exclusively via self-registration
        `POST /auth/registro`). Validated server-side; a request with
        `rol: 'owner'` receives `400` with message
        `rol must be one of: admin, member`. Non-admins receive `403`.
        Transitions out of `owner` are deferred to the `places-refactor`
        change (CH-03).
      parameters:
        - name: uid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRol'
      responses:
        "200":
          description: Updated `Usuario` document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        "400":
          description: Body's `rol` is not in `[admin, owner, member]`.
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'admin'`.
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'

  # — solicitudes approve/reject paths (change auth-usuarios) —

  /solicitudes/{id}/approve:
    post:
      summary: Aprobar una solicitud (admin-only)
      security:
        - bearerAuth: []
      description: |
        Admin-only. `@Roles('admin')` enforced by `RolesGuard`. The solicitud
        transitions to `status: 'aprobado'`, `revisadoPor: <caller uid>`
        (from `@CurrentUser()`), `revisadoAt: <now>`. The side-effect
        propagates to the linked `places`/`eventos` document via the
        existing `SolicitudesService.approve` handler. Returns `409` if the
        solicitud is not `'pendiente'`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Solicitud aprobada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum: [aprobado]
                  revisadoPor:
                    type: string
                  revisadoAt:
                    type: string
                    format: date-time
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'admin'`.
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'
        "409":
          description: Solicitud is not `'pendiente'`.
          $ref: '#/components/schemas/Error'

  /solicitudes/{id}/reject:
    post:
      summary: Rechazar una solicitud (admin-only)
      security:
        - bearerAuth: []
      description: |
        Admin-only. `@Roles('admin')` enforced by `RolesGuard`. Body accepts
        `{ comentarios?: string }` (admin's free-text rejection note;
        max 500 chars). Any other body property receives `400`
        (`forbidNonWhitelisted`). The solicitud transitions to
        `status: 'rechazado'`, `revisadoPor: <caller uid>`,
        `revisadoAt: <now>`, `comentarios: <body>`. Returns `409` if not `'pendiente'`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudApproveRejectBody'
      responses:
        "200":
          description: Solicitud rechazada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum: [rechazado]
                  revisadoPor:
                    type: string
                  revisadoAt:
                    type: string
                    format: date-time
                  comentarios:
                    type: string
                    nullable: true
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "403":
          description: Caller's `rol` is not `'admin'`.
          $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/schemas/Error'
        "409":
          description: Solicitud is not `'pendiente'`.
          $ref: '#/components/schemas/Error'