    AbiertoAhoraResponse:
      type: object
      required: [abierto]
      properties:
        abierto:
          type: boolean
        turno:
          $ref: '#/components/schemas/Turno'

    MapDataItem:
      type: object
      required: [id, slug, nombre, coordenadas, categoriaId, barrioId]
      properties:
        id:
          type: string
        slug:
          type: string
        nombre:
          type: string
        coordenadas:
          $ref: '#/components/schemas/Coordenadas'
        categoriaId:
          type: string
        barrioId:
          type: string

    Evento:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        nombre:
          type: string
        descripcionCorta:
          type: string
