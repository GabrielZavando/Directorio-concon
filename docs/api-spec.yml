openapi: 3.0.3
info:
  title: Directorio Concón API
  description: |
    API REST para el Directorio de Empresas de Concón (NestJS + Firebase Firestore).
    Contrato entre frontend y backend — actualizar ANTES de implementar cambios.
  version: "1.0.0"
  contact:
    name: Agencia Digital
    url: https://agencia-digital.cl
    email: desarrollo@agencia-digital.cl

servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
  - url: https://api.directorio-concon.com/v1
    description: Producción (VPS Docker)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de Firebase Auth (idToken)

  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Empresa:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        slug:
          type: string
        descripcion:
          type: string
        categoriaId:
          type: string
        barrioId:
          type: string
        direccion:
          type: string
        telefono:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        sitioWeb:
          type: string
          nullable: true
        planId:
          type: string
          enum: [gratuito, premium]
        destacado:
          type: boolean
        verificado:
          type: boolean
        status:
          type: string
          enum: [pendiente, aprobado, rechazado]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateEmpresa:
      type: object
      required: [nombre, descripcion, categoriaId, barrioId, direccion, planId]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        descripcion:
          type: string
          minLength: 10
          maxLength: 1000
        categoriaId:
          type: string
        barrioId:
          type: string
        direccion:
          type: string
          maxLength: 200
        telefono:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        sitioWeb:
          type: string
          format: uri
          nullable: true
        planId:
          type: string
          enum: [gratuito, premium]
        coordenadas:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number

    UpdateEmpresa:
      type: object
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        telefono:
          type: string
        email:
          type: string
        sitioWeb:
          type: string
        horarios:
          type: string

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: API operativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /empresas:
    get:
      summary: Listar empresas (paginado, filtros)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: categoriaId
          in: query
          schema: { type: string }
        - name: barrioId
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pendiente, aprobado, rechazado] }
      responses:
        "200":
          description: Lista de empresas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Empresa'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        "401":
          $ref: '#/components/schemas/Error'
    post:
      summary: Crear empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmpresa'
      responses:
        "201":
          description: Empresa creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        "400":
          $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/schemas/Error'
        "409":
          description: Slug duplicado
          $ref: '#/components/schemas/Error'

  /empresas/{id}:
    get:
      summary: Obtener empresa por id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        "404":
          $ref: '#/components/schemas/Error'
    put:
      summary: Actualizar empresa
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmpresa'
      responses:
        "200":
          description: Empresa actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        "404":
          $ref: '#/components/schemas/Error'
    delete:
      summary: Eliminar empresa
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Eliminada
        "404":
          $ref: '#/components/schemas/Error'

  /empresas/slug/{slug}:
    get:
      summary: Obtener empresa por slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        "404":
          $ref: '#/components/schemas/Error'
